  citations: 0
  url: https://doi.org/10.11588/heidok.00035613
  featured: false
  hidden: false
  thumbnail: /assets/img/publications/10.11588-heidok.00035613.png
  description: 'My doctoral thesis: a set of models and simulation tools for dark matter interacting with
    dynamical black holes, and forecasts of what next-generation gravitational-wave observatories could
    learn from them.'
  abstract: The inception of gravitational wave astronomy has plunged astrophysical sciences into a new
    era. Gravitational wave signals sourced by strong gravity regimes provide enormous information aboutthe
    surrounding environments from which they came. This allows remarkably powerful studies tobe performed
    regarding the fundamental nature of gravity, dark energy, and dark matter. Thesecurrent and future
    studies require very high accuracy and precision in the physical models theydevelop in order to extract
    all potential information from observed data. In particular, due to thefeeble coupling between matter
    and gravity, very strong gravitational environments provide thehighest quality of information regarding
    surrounding fundamental fields. To that end, the primaryobjective of this thesis is to generate models
    of dark matter interacting with highly dynamical blackhole systems and forecast potential observability
    using upcoming gravitational wave observatories. Several studies and tools were developed to further
    this goal, culminating in new numerical relativ-ity toolkits, parameter constraints, and theoretical
    results. While much more work still needs to bedone to fully leverage the prowess of upcoming gravitational
    wave observatories, the work in thisthesis provides great advancements and powerful tools in the pursuit
    of understanding the funda-mental building blocks of the universe.
- id: '2304.14129'
  title: Detecting fundamental vector fields with LISA
  authors:
  - S. D. B. Fell
  - L. Heisenberg
  - D. Veske
  year: 2023
  date: '2023-04-27'
  type: article
  venue: Physical Review D
  volume: '108'
  pages: 083010
  doi: 10.1103/physrevd.108.083010
  arxiv: '2304.14129'
  inspire: 2654794
  citations: 20
  url: https://arxiv.org/abs/2304.14129
  featured: true
  hidden: false
  thumbnail: /assets/img/publications/2304.14129.png
  description: Space-based gravitational-wave detectors could double as dark matter experiments. We model
    how a cloud of dark photons grown by a spinning supermassive black hole alters the orbit of a small
    companion, and show that LISA could use these signals to constrain the dark photon's mass.
  abstract: The advent of gravitational wave astronomy has seen a huge influx of new predictions for potential
    discoveries of beyond the Standard Model fields. The coupling of all fundamental fields to gravity,
    together with its dominance on large scales, makes gravitational physics a rich laboratory to study
    fundamental physics. This holds especially true for the search for the elusive dark photon, a promising
    dark matter candidate. The dark photon is predicted to generate instabilities in a rotating black
    hole spacetime, birthing a macroscopic Bose-Einstein condensate. These condensates can especially
    form around super massive black holes, modifying the dynamical inspiralling process. This then opens
    another window to leverage future space-borne gravitational wave antennas to join the hunt for the
    elusive dark matter particle. This study builds a preliminary model for the gravitational waveform
    emitted by such a dressed extreme mass-ratio inspiral. Comparing these waveforms to the vacuum scenario
    allows projections to the potential constrainability on the dark photon mass by space-borne gravitational
    wave antennas. The superradiant instability of a massive vector field on a Kerr background is calculated
    and, under reasonable approximations, the backreaction on the orbit of an inspiralling solar mass-scale
    compact object due to the secular evolution of the resulting boson cloud is determined. The end result
    is the projection that the LISA mission should be able to constrain the dark photon mass using extreme
    mass ratio inspirals in the range [1.8 times 10^{-17}, 4.47 times 10^{-16}] eV.
