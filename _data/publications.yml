  arxiv: '2201.11634'
  inspire: 2020688
  citations: 18
  url: https://arxiv.org/abs/2201.11634
  featured: false
  hidden: false
  thumbnail: /assets/img/publications/2201.11634.png
  description: A student-friendly set of lecture notes on gravitational waves in full, non-linear general
    relativity. From the Newman-Penrose formalism to the structure of null infinity and the BMS group,
    with worked examples and exercises throughout.
  abstract: These notes provide a student-friendly introduction to the theory of gravitational waves in
    full, non-linear general relativity (GR). We aim for a balance between physical intuition and mathematical
    rigor and cover topics such as the Newman-Penrose formalism, electromagnetic waves, asymptotically
    Minkowski spacetimes, the peeling theorem, the universal structure of null infinity, the Bondi-Metzner-Sachs
    group, and the definition of radiative modes in linear as well as in non-linear GR. Many exercises
    and some explicitly calculated examples complement the abstract theory and are designed to help students
    build up their intuition and see the mathematical machinery at work.
- id: '2109.03174'
  title: Black holes in f(Q) gravity
  authors:
  - F. D'Ambrosio
  - S. D. B. Fell
  - L. Heisenberg
  - S. Kuhn
  year: 2022
  date: '2021-09-07'
  type: article
  venue: Physical Review D
  volume: '105'
  pages: '024042'
  doi: 10.1103/physrevd.105.024042
  arxiv: '2109.03174'
  inspire: 1918134
  citations: 266
  url: https://arxiv.org/abs/2109.03174
  featured: true
  hidden: false
  thumbnail: /assets/img/publications/2109.03174.png
  description: General relativity can be rewritten in terms of non-metricity instead of curvature, and
    its non-linear extension f(Q) changes the physics. We derive the most general static, spherically
    symmetric geometries in f(Q) gravity and prove that it admits both GR-like and genuinely new black
    hole solutions, settling a debate in the literature.
  abstract: We systematically study the field equations of f(Q) gravity for spherically symmetric and
    stationary metric-affine spacetimes. Such spacetimes are described by a metric as well as a flat and
    torsionless affine connection. In the Symmetric Teleparallel Equivalent of GR (STEGR), the connection
    is pure gauge and hence unphysical. However, in the non-linear extension f(Q), it is promoted to a
    dynamical field which changes the physics. Starting from a general metric-affine geometry, we construct
    the most general static and spherically symmetric forms of the metric and the affine connection. We
    then use these symmetry reduced geometric objects to prove that the field equations of f(Q) gravity
    admit GR solutions as well as beyond-GR solutions, contrary to what has been claimed in the literature.
    We formulate precise criteria, under which conditions it is possible to obtain GR solutions and under
    which conditions it is possible to obtain beyond-GR solutions. We subsequently construct several perturbative
    corrections to the Schwarzschild solution for different choices of f(Q), which in particular include
    a hair stemming from the now dynamical affine connection. We also present an exact beyond-GR vacuum
    solution. Lastly, we apply this method of constructing spherically symmetric and stationary solutions
    to f(T) gravity, which reproduces similar solutions but without a dynamical connection.
- id: '2104.06488'
  title: Positive energy warp drive from hidden geometric structures
  authors:
  - S. D. B. Fell
  - L. Heisenberg
  year: 2021
  date: '2021-04-13'
  type: article
  venue: Classical and Quantum Gravity
  volume: '38'
  pages: '155020'
  doi: 10.1088/1361-6382/ac0e47
  arxiv: '2104.06488'
  inspire: 1858216
  citations: 32
  url: https://arxiv.org/abs/2104.06488
  featured: true
  hidden: false
  thumbnail: /assets/img/publications/2104.06488.png
  description: Warp drives have long been thought to require enormous amounts of negative energy. By uncovering
    a hidden geometric structure in the energy of these spacetimes, we construct superluminal warp bubbles
    sourced entirely by positive energy, with total energy requirements four orders of magnitude below
    a solar mass.
  abstract: Warp drives in Einstein's general theory of relativity provide a unique mechanism for manned
    interstellar travel. It is well-known that the classical superluminal soliton spacetimes require negative
    energy densities, likely sourced by quantum processes of the uncertainty principle. It has even been
    claimed by few that negative energy densities are a requirement of superluminal motion. However, recent
    studies suggest this may not be the case. A general decomposition of the defining variables and the
    corresponding decomposition of the Eulerian energy are studied. A geometrical interpretation of the
    Eulerian energy is found, shedding new light on superluminal solitons generated by realistic energy
    distributions. With this new interpretation, it becomes a relatively simple matter to generate solitonic
    configurations, within a certain subclass, that respect the positive energy constraint. Using this
    newfound interpretation, a superluminal solitonic spacetime is presented that possesses positive semi-definite
    energy. A modest numerical analysis is carried out on a set of example configurations, finding total
    energy requirements four orders of magnitude smaller than the solar mass. Extraordinarily, the example
    configurations are generated by purely positive energy densities, a tremendous improvement on the
    classical configurations. The geometrical interpretation of the Eulerian energy thus opens new doors
    to generating realistic warp fields for laboratory study and potential future manned interstellar
    travel.
