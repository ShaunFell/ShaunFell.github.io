- id: '2608.10800'
  title: Radiative Signatures from Warp Drives Traveling Through the Earth's Atmosphere
  authors:
  - S. D. B. Fell
  - A. Loeb
  year: 2026
  date: '2026-08-11'
  type: preprint
  arxiv: '2608.10800'
  inspire: 3190030
  citations: 0
  url: https://arxiv.org/abs/2608.10800
  abstract: We investigate the observable signatures of zero ADM mass warp drive spacetimes traversing
    Earth's atmosphere. Numerical simulations indicate that an aircraft-scale spacetime bubble moving
    at relativistic velocities would have a pronounced observational signature, where interaction with
    the atmosphere can produce luminosities exceeding one terawatt. The signature of a spacetime bubble
    at rest or moving at low velocity relative to the Earth would not generate such extreme luminosities.
    These results establish observational constraints on spacetime-based propulsion operating within the
    terrestrial environment and provide a framework for identifying potential high-velocity signatures.
    In particular, a warp drive traveling through the atmosphere at speeds exceeding approximately 10%
    of the speed of light would produce a unique brilliant glow.
  description: 'If exotic warp-drive propulsion were ever operating near Earth, it should not be able
    to hide: we simulated how a small, aircraft-sized spacetime bubble would sweep up and energize the
    air around it. Above roughly a tenth of the speed of light the interaction releases more than a trillion
    watts, producing an unmistakable glow, while slow-moving bubbles stay dark.'
  thumbnail: /assets/img/publications/2608.10800.png
  featured: true
  hidden: false
- id: '2406.11299'
  title: Proca in an Expanding Universe
  authors:
  - S. D. B. Fell
  - L. Heisenberg
  year: 2024
  date: '2024-06-17'
  type: article
  venue: Fortschritte der Physik
  volume: '72'
  pages: '2400110'
  doi: 10.1002/prop.202400110
  arxiv: '2406.11299'
  inspire: 2799316
  citations: 3
  url: https://arxiv.org/abs/2406.11299
  featured: false
  hidden: false
  thumbnail: /assets/img/publications/2406.11299.png
  description: Massive vector fields can grow explosively around spinning black holes, but almost every
    study of this effect ignores the dark energy that fills our universe. Using GRBoondi, we show that
    adding a cosmological constant can turn a growing instability into a decaying one, changing what these
    systems would look like.
  abstract: The superradiant growth of massive vector fields in rotating black hole spacetimes has garnered
    significant attention in recent literature. However, the majority of these studies overlook the influence
    of a cosmological constant, which likely constitutes the primary energy content of our universe. In
    this paper, we extend recent research by incorporating a cosmological constant into the Einstein+Proca
    system and numerically evolving the resulting equations of motion. Utilizing the newly released GRBoondi
    numerical relativity code, designed specifically for the numerical evolution of (generalized) Proca
    fields, we discover that parameters causing a growing instability in the Lambda = 0 scenario transition
    to a decaying state when Lambda > 0. This results in a more intriguing phenomenology. These simulations
    pave the way for future full Einstein+Proca simulations to explore the secular decay of the resultant
    cloud from gravitational emission.
- id: '2405.01348'
  title: 'GRBoondi: A code for evolving Generalized Proca theories on arbitrary backgrounds'
  authors:
  - S. D. B. Fell
  - L. Heisenberg
  year: 2024
  date: '2024-05-02'
  type: software
  venue: Journal of Open Source Software
  volume: '9'
  pages: '6888'
  doi: 10.21105/joss.06888
  arxiv: '2405.01348'
  inspire: 2782899
  citations: 4
  url: https://arxiv.org/abs/2405.01348
  code: https://github.com/ShaunFell/GRBoondi
  featured: true
  hidden: false
  thumbnail: /assets/img/publications/2405.01348.png
  description: Simulating exotic fields in curved spacetime usually means writing a new code from scratch.
    GRBoondi is an open-source numerical relativity code that evolves any generalized Proca theory on
    any fixed background, so a new model can be studied in days rather than months.
  abstract: While numerical simulations offer unparalleled precision and robustness in studying complex
    physical systems, their execution is often hindered by complexity, costliness, and time consumption
    due to the intricate equations involved. This challenge is already encountered in General Relativity,
    where non-flat spacetimes exacerbate the computational burden. This complexity is further intensified
    when dealing with additional degrees of freedom. To address this challenge head-on, we introduce GRBoondi,
    a groundbreaking fixed-background numerical relativity code designed to provide a unified interface
    for numerically solving Generalized Proca theories. GRBoondi grants users the ability to make arbitrary
    modifications to the Proca equations of motion on any background, providing a robust and versatile
    tool for exploring diverse classes of Generalized Proca theories. This letter serves as part of the
    submission of GRBoondi to the Journal of Open Source Software. For access to the code, please visit
    https://github.com/ShaunFell/GRBoondi.git.
- id: 10.11588/heidok.00035613
  title: 'Celestial Beacons: How Black Holes Illuminate the Path to Vector Dark Matter'
  authors:
  - S. D. B. Fell
