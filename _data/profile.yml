# One sentence shown under your name on the home page.
pitch: >-
  I study gravity at its extremes: black holes, the fundamental fields that
  might surround them, and the geometry of spacetimes we would one day like to
  build ourselves.

# A few paragraphs for the "About" section. Markdown is allowed.
about: |
  I am a theoretical physicist working at the intersection of general
  relativity, particle physics and high-performance computing. My research asks
  what black holes can tell us about physics beyond the Standard Model, and
  whether spacetime itself can be engineered.

  I completed my PhD at the Institute for Theoretical Physics in Heidelberg,
  where I studied superradiant instabilities of massive vector fields around
  rotating black holes and their gravitational-wave signatures for LISA. Along
  the way I wrote [GRBoondi](https://github.com/ShaunFell/GRBoondi), an
  open-source numerical relativity code for evolving generalized Proca fields
  on arbitrary backgrounds. Before Heidelberg I studied at ETH Zurich, where my
  master's thesis uncovered a hidden geometric structure in warp drive
  spacetimes, and at the University of Washington.

  Today I lead research on applications of gravity to geophysical sciences, projects on fully-homomorphic encryption,
  warp drive physics and related questions in
  spacetime engineering at Applied Physics, and much more.

