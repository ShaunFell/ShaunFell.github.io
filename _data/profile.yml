research:
  - title: Black holes as particle detectors
    image: /assets/img/research/eht-m87.jpg
    image_credit: EHT Collaboration
    summary: >-
      Ultralight bosons can grow exponentially around spinning black holes
      through superradiance. I study massive vector (Proca) fields in this
      regime, from their nonlinear evolution to the gravitational waves that
      LISA could use to detect them.
    link: /publications/
  - title: Numerical relativity and open software
    image: /assets/img/research/gravity-well.jpg
    summary: >-
      Strong-field gravity rarely yields to pen and paper. I build simulation
      tools, including GRBoondi, an open-source code for evolving generalized
      Proca theories on arbitrary spacetime backgrounds.
    link: https://github.com/ShaunFell/GRBoondi
  - title: Warp drives and spacetime engineering
    image: /assets/img/research/warp-bubble.png
    summary: >-
      Can we choose the shape of spacetime and ask what matter would produce it?
      My work uncovered hidden geometric structure in warp drive spacetimes and
      now explores their observable signatures.
    link: /writing/warp-drives/
