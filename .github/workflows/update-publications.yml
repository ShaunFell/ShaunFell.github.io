name: Update publications

on:
  schedule:
    # Every Monday at 06:00 UTC. INSPIRE indexes new arXiv listings daily.
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      regen_descriptions:
        description: "Re-generate every description with Claude"
        type: boolean
        default: false
      regen_thumbnails:
        description: "Re-render every thumbnail"
        type: boolean
        default: false
      forget:
        description: "Test mode: arXiv id to forget so the run re-discovers it as a new paper (e.g. 2608.10800)"
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: update-publications
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Sync publications from INSPIRE-HEP and ORCID
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_WORKSPACE_ID: ${{ vars.ANTHROPIC_WORKSPACE_ID }}
        run: |
          python scripts/update_publications.py \
            ${{ inputs.regen_descriptions && '--regen-descriptions' || '' }} \
            ${{ inputs.regen_thumbnails && '--regen-thumbnails' || '' }} \
            ${{ inputs.forget && format('--forget {0}', inputs.forget) || '' }}

      - name: Commit and push changes
        id: commit
        run: |
          git add -A _data/publications.yml assets/img/publications
          if git diff --cached --quiet; then
            echo "No changes."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(publications): sync from INSPIRE-HEP ($(date -u +%Y-%m-%d))"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

  # Pushes made with GITHUB_TOKEN do not trigger other workflows, so deploy
  # explicitly when something changed.
  deploy:
    needs: update
    if: needs.update.outputs.changed == 'true'
    uses: ./.github/workflows/deploy.yml
    permissions:
      contents: read
      pages: write
      id-token: write
